<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="GovHelm Housing">
  <title>GovHelm Housing</title>
  <!-- GovHelm ring, unchanged: same radius, same stroke weight, same ink. -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#141C2E" stroke-width="9"/>
  <!-- All eight spokes, unchanged from GovHelm. They are short ticks CROSSING the ring
       (r=45 to r=33), so they never touch the aperture and the helm read is preserved. -->
  <g stroke="#3FA46A" stroke-width="9" stroke-linecap="round">
    <line x1="50" y1="5" x2="50" y2="17"/>
    <line x1="50" y1="83" x2="50" y2="95"/>
    <line x1="5" y1="50" x2="17" y2="50"/>
    <line x1="83" y1="50" x2="95" y2="50"/>
    <line x1="18.2" y1="18.2" x2="26.7" y2="26.7"/>
    <line x1="73.3" y1="73.3" x2="81.8" y2="81.8"/>
    <line x1="18.2" y1="81.8" x2="26.7" y2="73.3"/>
    <line x1="73.3" y1="26.7" x2="81.8" y2="18.2"/>
  </g>
  <!-- The aperture, enlarged from r=14 to r=20 to carry a form rather than a dot. -->
  <circle cx="50" cy="50" r="20" fill="#FFFFFF"/>
  <path d="M50 37 L64 50 L60 50 L60 62 L40 62 L40 50 L36 50 Z" fill="#3FA46A"/>
</svg>
